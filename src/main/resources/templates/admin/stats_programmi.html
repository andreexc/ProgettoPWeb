<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Olympus Fitness - Grafico Programmi</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- as in the assignment hint -->
    </head>
    <body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100"
          style="background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000') no-repeat center center/cover;">

        <div class="container" style="max-width: 800px;">
            <div class="card bg-black border-0 shadow rounded-4 text-white p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
                    <h3 class="fw-bold m-0 text-warning">
                        <i class="bi bi-bar-chart-line-fill me-2"></i>Statistiche Allenamenti Totali
                    </h3>
                    <a th:href="@{/admin/home}" class="btn btn-sm btn-outline-light rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                </div>

                <p class="text-secondary small mb-4">Istogramma riepilogativo delle schede totali completate dagli iscritti con piano Basic e Pro.</p>

                <div style="position: relative; height: 350px; width: 100%;">
                    <canvas id="programmiChart"></canvas>
                </div>
            </div>
        </div>

        <!-- js script inline because we have dynamic data to handle -->
        <script th:inline="javascript">
            // "/* ... */" is the official thymeleaf syntax for injecting thymeleaf variables inside javascript without breaking everything
            const labelsProgrammi = /*[[${programmiLabels}]]*/ ['Full Body', 'Push/Pull/Legs', 'Cardio', 'Strength'];
            const datiProgrammi = /*[[${programmiValori}]]*/ [0, 0, 0, 0];

            const ctx = document.getElementById('programmiChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labelsProgrammi,
                    datasets: [{
                        label: 'Sessioni Completate',
                        data: datiProgrammi,
                        backgroundColor: 'rgba(255, 193, 7, 0.75)', // Giallo Olympus
                        borderColor: '#ffc107',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#aaa' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#aaa',
                                stepSize: 1
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        </script>
    </body>
</html>
