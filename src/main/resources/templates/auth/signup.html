<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Registrati</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100 d-flex align-items-center justify-content-center" style="min-height: 100vh; overflow: hidden;">

    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100"
         style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100"
         style="background: rgba(0, 0, 0, 0.7); z-index: -1;"></div>

    <div class="container" style="padding-top: 8rem; padding-bottom: 4rem;">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card auth-card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5 text-dark">
                        <h2 class="card-title text-center mb-4 fw-bold">Registrati</h2>

                        <form th:action="@{/signup}" th:object="${signupForm}" method="post">
                            <div th:if="${signupError}" class="alert text-center border-0 small py-2 mb-3" role="alert"
                                 style="background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7 !important;">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <b th:text="${signupError}">Errore di registrazione</b>
                            </div>
                            <div class="row">
                                <div class="col-sm-6 mb-3">
                                    <div class="form-floating text-dark">
                                        <input type="text" th:field="*{nome}" class="form-control custom-input" id="nameInput" placeholder="Nome" required>
                                        <label for="nameInput">Nome</label>
                                    </div>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <div class="form-floating text-dark">
                                        <input type="text" th:field="*{cognome}" class="form-control custom-input" id="surnameInput" placeholder="Cognome" required>
                                        <label for="surnameInput">Cognome</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-3 text-dark">
                                <input type="date" th:field="*{dataNascita}" id="birthdateInput" class="form-control custom-input" required>
                                <label for="birthdateInput">Data di nascita</label>
                            </div>

                            <div class="form-floating mb-3 text-dark">
                                <input type="email" th:field="*{email}" id="emailInput" class="form-control custom-input" placeholder="Email" required>
                                <label for="emailInput">Email</label>
                            </div>

                            <div class="form-floating mb-3 text-dark">
                                <input type="text" th:field="*{username}" class="form-control custom-input" id="usernameInput" placeholder="Username" required>
                                <label for="usernameInput">Username</label>
                            </div>

                            <div class="form-floating mb-3 position-relative">
                                <input type="password" th:field="*{password}" id="loginPassword" class="form-control custom-input pe-5" placeholder="Password" required>
                                <label for="loginPassword">Password</label>
                                <button class="btn btn-reveal-inside position-absolute top-50 end-0 translate-middle-y me-2" type="button" data-toggle-password="loginPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div class="form-floating mb-3 position-relative">
                                <input type="password" th:field="*{confermaPassword}" id="ConfirmloginPassword" class="form-control custom-input pe-5" placeholder="Conferma Password" required>
                                <label for="ConfirmloginPassword">Conferma Password</label>
                                <button class="btn btn-reveal-inside position-absolute top-50 end-0 translate-middle-y me-2" type="button" data-toggle-password="ConfirmloginPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div id="differentPasswords" class="alert alert-danger p-2 text-center small mt-3 d-none border-0 rounded-3" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>Le password non corrispondono!
                            </div>

                            <h5 class="fw-bold mb-3 mt-4 text-dark">Seleziona il tuo piano di allenamento</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="card h-100 p-3 text-center border rounded-3 custom-plan-card" style="cursor: pointer;">
                                        <input type="radio" th:field="*{pianoAllenamento}" value="Prova" class="form-check-input mx-auto mb-2" required>
                                        <span class="fw-bold d-block text-dark">Prova</span>
                                        <small class="text-muted d-block my-2" style="font-size: 0.75rem;">Accesso limitato alle funzioni base per testare la piattaforma.</small>
                                        <span class="badge bg-secondary mt-auto">Gratis</span>
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <label class="card h-100 p-3 text-center border rounded-3 custom-plan-card" style="cursor: pointer;">
                                        <input type="radio" th:field="*{pianoAllenamento}" value="Basic" class="form-check-input mx-auto mb-2">
                                        <span class="fw-bold d-block text-dark">Basic</span>
                                        <small class="text-muted d-block my-2" style="font-size: 0.75rem;">Schede di allenamento standard e tracciamento kcal.</small>
                                        <span class="badge bg-primary mt-auto">€9.99 / mese</span>
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <label class="card h-100 p-3 text-center border rounded-3 custom-plan-card" style="cursor: pointer;">
                                        <input type="radio" th:field="*{pianoAllenamento}" value="Pro" class="form-check-input mx-auto mb-2">
                                        <span class="fw-bold d-block text-dark">Pro</span>
                                        <small class="text-muted d-block my-2" style="font-size: 0.75rem;">Programmi personalizzati illimitati e supporto avanzato.</small>
                                        <span class="badge bg-warning text-dark mt-auto">€99.00 / anno</span>
                                    </label>
                                </div>
                            </div>

                            <div id="wrongPassword" class="alert alert-danger p-2 small mt-3 d-none border-0 rounded-3" role="alert">
                                <div class="text-center fw-bold mb-1"><i class="bi bi-shield-slash-fill me-2"></i>La password deve contenere:</div>
                                <ul class="mb-0 ps-3">
                                    <li>Almeno 8 caratteri</li>
                                    <li>Il pattern identificativo richiesto</li>
                                </ul>
                            </div>

                            <button class="btn btn-light btn-lg w-100 fw-bold rounded-pill shadow-sm mt-4" type="submit">
                                Completa Registrazione
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Hai già un account? <a th:href="@{/login}" class="text-dark fw-bold text-decoration-none hover-underline">Accedi</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth/passwordEye.js}"></script>
<script th:src="@{/js/auth/passwordChecker.js}"></script>
</body>
</html>
