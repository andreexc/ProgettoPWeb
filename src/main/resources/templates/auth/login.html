<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Login</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100 d-flex align-items-center justify-content-center" style="min-height: 100vh; overflow: hidden;">

    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100"
         style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100"
         style="background: rgba(0, 0, 0, 0.7); z-index: -1;"></div>

    <div class="container" style="padding-top: 8rem; padding-bottom: 4rem;">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5 text-dark">
                        <h2 class="card-title text-center mb-4 fw-bold">Accedi</h2>

                        <form th:action="@{/login}" th:object="${loginForm}" method="post">
                            <div class="form-floating mb-3 text-dark">
                                <input type="text" th:field="*{username}" class="form-control custom-input" id="usernameInput" placeholder="Username" required>
                                <label for="usernameInput">Username</label>
                            </div>

                            <div class="form-floating mb-3 position-relative">
                                <input type="password" th:field="*{password}" id="loginPassword" class="form-control custom-input pe-5" placeholder="Password" required>
                                <label for="loginPassword">Password</label>
                                <button class="btn btn-reveal-inside position-absolute top-50 end-0 translate-middle-y me-2" type="button" data-toggle-password="loginPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <button class="btn btn-light btn-lg w-100 fw-bold rounded-pill shadow-sm" type="submit">
                                Accedi
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Non hai un account? <a th:href="@{/signup}" class="text-dark fw-bold text-decoration-none hover-underline">Registrati</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth/passwordEye.js}"></script>
</body>
</html>
