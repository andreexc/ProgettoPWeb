<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/auth.css}" href="../../static/css/auth.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-5 p-sm-6">
                    <h3 class="card-title text-center mb-4 fw-bold text-primary">Accedi</h3>

                    <form th:action="@{/login}" th:object="${loginForm}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" th:field="*{username}" class="form-control" id="usernameInput" placeholder="Inserisci username" required>
                            <label for="usernameInput">Username</label>
                        </div>

                        <div class="input-group">
                            <div class="form-floating flex-grow-1">
                                <input type="password" th:field="*{password}" id="loginPassword" class="form-control" placeholder="Password" required>
                                <label for="loginPassword">Password</label>
                            </div>
                            <button class="btn btn-outline-secondary" type="button" data-toggle-password="loginPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <button class="btn btn-primary w-100 py-2 fw-medium mt-4" type="submit">Accedi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth/passwordEye.js}" src="../../static/js/auth/passwordEye.js"></script>
</body>
</html>
