<!--
    Only 1 navbar html file instead of 2 different ones.
    The final navbar depends if the user is authenticated or not.
-->

<!--
    sec:authorize and sec:authentication doesn't require spring to check in the model
    but instead it request those attributes to the Spring Security Context in memory
-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="it">
    <body>
        <div th:fragment="headerNav" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
            <link rel="stylesheet" th:href="@{/css/navbar.css}">
            <nav class="navbar navbar-expand-lg navbar-dark position-absolute top-0 start-50 translate-middle-x mt-3 custom-navbar-capsule" style="width: 90%; z-index: 1050;">
                <div class="container-fluid px-2">
                    <a class="navbar-brand custom-brand-circle" th:href="@{/index}">
                        <img th:src="@{/images/OlympusFitness_logo.svg}" alt="Logo" width="28" height="28">
                    </a>
                    <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPublic" aria-controls="navbarPublic" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-between" id="navbarPublic">
                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" th:href="@{/index}">Home</a>
                            </li>

                            <li class="nav-item" sec:authorize="isAnonymous()">
                                <a class="nav-link" th:href="@{/signup}">Registrati</a>
                            </li>
                            <li class="nav-item" sec:authorize="isAnonymous()">
                                <a class="nav-link" th:href="@{/login}">Inizia Allenamento</a>
                            </li>

                            <li class="nav-item" sec:authorize="isAuthenticated()">
                                <a class="nav-link text-warning fw-bold" th:href="@{/dashboard}">
                                    <i class="bi bi-speedometer2 me-1"></i>Dashboard
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/contatti}">Contattaci</a>
                            </li>
                        </ul>

                        <div class="d-flex align-items-center gap-3">
                            <div sec:authorize="isAnonymous()" class="d-none d-lg-flex">
                                <a th:href="@{/signup}" class="btn custom-navbar-btn">Iscriviti Ora</a>
                            </div>

                            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                                    <span class="text-white opacity-75 small me-2 d-none d-sm-inline">
                                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">Utente</span>
                                    </span>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm" style="font-weight: 600; font-size: 0.85rem; border: none; background-color: #dc3545;">
                                        <i class="bi bi-box-arrow-left me-1"></i>Logout
                                    </button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </nav>
        </div>
    </body>
</html>
