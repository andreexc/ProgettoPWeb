<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
    <body>
        <section th:fragment="carouselRecensioni" class="container my-5 py-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark">Dicono di Noi</h2>
                <p class="text-muted">Le testimonianze reali dei nostri atleti</p>
            </div>
            <div id="recensioniCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner custom-carousel-inner mx-auto" id="carousel-container">
                    <!-- Single review -->
                    <div class="carousel-item active">
                        <div class="review-card p-4 mx-auto text-center shadow-sm bg-white rounded-4 border">
                            <div class="text-warning mb-2">
                                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                            </div>
                            <p class="fs-5 italic text-muted">"Programmi fantastici! Ho ottenuto risultati incredibili in pochissimo tempo grazie al piano Pro."</p>
                            <h5 class="fw-bold mb-0 mt-3 text-dark">Laura B.</h5>
                            <span class="badge bg-secondary-subtle text-secondary mt-1">ROLE_USER_PRO</span>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="review-card p-4 mx-auto text-center shadow-sm bg-white rounded-4 border">
                            <div class="text-warning mb-2">
                                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-half"></i>
                            </div>
                            <p class="fs-5 italic text-muted">"La web app è super intuitiva, riesco a segnare i miei allenamenti completati velocemente."</p>
                            <h5 class="fw-bold mb-0 mt-3 text-dark">Marco G.</h5>
                            <span class="badge bg-secondary-subtle text-secondary mt-1">ROLE_USER_BASIC</span>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#recensioniCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#recensioniCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <script th:src="@{/js/reviews/recensioni-carousel.js}"></script>
        </section>
    </body>
</html>
