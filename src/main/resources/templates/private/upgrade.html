<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upgrade Piano - Fitness App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/index.css">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold">Sblocca il tuo potenziale</h1>
    <p class="lead text-muted">Scegli il piano più adatto ai tuoi obiettivi di fitness.</p>
  </div>

  <div th:if="${messaggioErrore}" class="alert alert-danger text-center mx-auto" style="max-width: 600px;">
    <p class="mb-0" th:text="${messaggioErrore}"></p>
  </div>

  <div class="row justify-content-center g-4">

    <div class="col-md-5 col-lg-4">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body text-center p-4">
          <h3 class="card-title mb-3">Piano BASIC</h3>
          <p class="card-text text-muted mb-4">Accesso completo a tutti i programmi standard della piattaforma.</p>
          <form th:action="@{/dashboard/upgrade}" method="post">
            <input type="hidden" name="pianoScelto" value="BASIC">
            <button type="submit" class="btn btn-cta-contact w-100 py-2">Attiva BASIC</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-5 col-lg-4">
      <div class="card h-100 shadow-sm border-0 border-primary">
        <div class="card-body text-center p-4">
          <h3 class="card-title mb-3 text-primary">Piano PRO</h3>
          <p class="card-text text-muted mb-4">Tutto quello del Basic + Crea i tuoi programmi personalizzati!</p>
          <form th:action="@{/dashboard/upgrade}" method="post">
            <input type="hidden" name="pianoScelto" value="PRO">
            <button type="submit" class="btn btn-primary w-100 py-2">Attiva PRO</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center mt-5">
    <a href="/dashboard" class="text-decoration-none hover-white">Torna alla dashboard</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
