<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Dashboard Prova</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100 d-flex align-items-center" style="min-height: 100vh; overflow: hidden;">
    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.8); z-index: -1;"></div>

    <div class="container text-white" style="padding-top: 8rem; padding-bottom: 4rem;">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h1 class="fw-bold mb-0 text-warning">
                    <i class="bi bi-lightning-fill me-2"></i>Area Personale
                </h1>
                <p class="text-white-50 mb-0">
                    Benvenuto/a, <span class="text-white fw-bold" th:text="${usernameUtente}">Utente</span>! Piano attuale: <span class="badge bg-warning text-dark">Prova</span>
                </p>
            </div>
            <div class="text-end">
                <span class="text-white-50 small d-block mb-1">Allenamenti Svolti</span>
                <span class="fs-3 fw-bold text-warning" th:text="${allenamentiSvolti} + '/3'">0/3</span>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow border-0 rounded-4 bg-white text-dark p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-sliders me-2 text-warning"></i>Funzionalità Disponibili</h5>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <a th:href="@{/dashboard/profilo}" class="btn btn-outline-dark w-100 py-3 fw-bold rounded-3">
                                <i class="bi bi-person-bounding-box d-block fs-3 mb-2"></i> Visualizza Profilo
                            </a>
                        </div>
                        <div class="col-sm-6">
                            <a th:href="@{/dashboard/cambio-password}" class="btn btn-outline-dark w-100 py-3 fw-bold rounded-3">
                                <i class="bi bi-key-fill d-block fs-3 mb-2"></i> Cambio Password
                            </a>
                        </div>
                        <div class="col-sm-6">
                            <a th:href="@{/dashboard/allenamento}" class="btn btn-warning text-dark w-100 py-3 fw-bold rounded-3">
                                <i class="bi bi-play-circle-fill d-block fs-3 mb-2"></i> Inizia Allenamento
                            </a>
                        </div>
                        <div class="col-sm-6">
                            <a th:href="@{/dashboard/upgrade}" class="btn btn-primary w-100 py-3 fw-bold rounded-3">
                                <i class="bi bi-arrow-up-circle-fill d-block fs-3 mb-2"></i> Upgrade Account
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow border-0 rounded-4 bg-white text-dark p-4 h-100">
                    <h5 class="fw-bold mb-2"><i class="bi bi-chat-left-heart-fill text-danger me-2"></i>Lascia una Recensione</h5>
                    <p class="text-muted small mb-3">Condividi la tua esperienza Olympus Fitness. Il carosello si aggiornerà istantaneamente!</p>

                    <form id="ajaxReviewForm" method="post" class="mt-auto">
                        <div class="mb-3">
                            <label for="testoRecensione" class="form-label small fw-bold">Il tuo messaggio:</label>
                            <textarea class="form-control" id="testoRecensione" rows="4" placeholder="Scrivi qui la tua opinione..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold rounded-pill">
                            <i class="bi bi-send-fill me-2"></i>Inserisci recensione
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/reviews :: carouselRecensioni}"></div>
<div th:replace="~{fragments/footer :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/recensioni-carousel.js}"></script>
<script th:src="@{/js/recensioni-ajax.js}"></script>
</body>
</html>
