<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Allenamenti</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">

    <!-- csrf meta tag necessario per l'invio dell'allenamento -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        .workout-card {
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .workout-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 .75rem 1.5rem rgba(0,0,0,.15) !important;
        }
        .kcal-badge {
            font-size: 1rem;
        }
        .exercise-row:not(:last-child) {
            border-bottom: 1px solid #eee;
        }
        .exercise-name {
            font-weight: 600;
        }
        .exercise-meta {
            font-size: .85rem;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100" style="min-height: 100vh; overflow: hidden;">
    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.85); z-index: -1;"></div>

    <div class="container text-white" style="padding-top: 8rem; padding-bottom: 4rem;">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h1 class="fw-bold mb-0 text-warning"><i class="bi bi-clipboard2-pulse-fill me-2"></i>I Tuoi Allenamenti</h1>
                <p class="text-white-50 mb-0">Scegli l'allenamento da iniziare</p>
            </div>
        </div>

        <!-- Caso in cui non c'è nessun allenamento disponibile -->
        <!-- Non dovrebbe comunque essere utilizzato perché ci sono gli allenamenti di base, ma utile per testing -->
        <div th:if="${#lists.isEmpty(listaAllenamenti)}" class="card shadow border-0 rounded-4 bg-white text-dark p-5 text-center">
            <i class="bi bi-clipboard-x display-4 text-secondary mb-3"></i>
            <h5 class="fw-bold">Nessun allenamento disponibile</h5>
            <p class="text-secondary mb-0">Al momento non ci sono allenamenti assegnati al tuo profilo.</p>
        </div>
        <div class="col-lg-6" th:each="allenamento : ${listaAllenamenti}">
            <a th:href="@{/dashboard/allenamento/{id}(id=${allenamento.id})}" class="text-decoration-none">
                <div class="card workout-card shadow border-0 rounded-4 bg-white text-dark p-4 h-100 d-flex flex-row align-items-center justify-content-between">
                    <h5 class="fw-bold mb-0" th:text="${allenamento.nomeProgramma}">Nome Allenamento</h5>
                    <i class="bi bi-chevron-right text-danger fs-4"></i>
                </div>
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
