<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Sicurezza Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body class="bg-dark d-flex flex-column min-vh-100 text-white">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100 d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.85); z-index: -1;"></div>

    <div class="container" style="max-width: 500px; margin-top: 6rem; margin-bottom: 3rem;">
        <div class="card shadow border-0 rounded-4 bg-white text-dark p-4">

            <div class="text-center mb-4">
                <div class="display-4 text-danger"><i class="bi bi-shield-lock"></i></div>
                <h2 class="fw-bold m-0 text-dark">Modifica Password</h2>
                <p class="text-muted mb-0">Proteggi il tuo account Olympus</p>
            </div>

            <div th:if="${messaggioErrore}" class="alert alert-danger alert-dismissible fade show fw-medium mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${messaggioErrore}">Errore server</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/dashboard/cambio-password}" method="post">

                <div class="mb-3">
                    <label for="vecchiaPassword" class="form-label fw-semibold">Attuale Password</label>
                    <input type="password" class="form-control rounded-3" id="vecchiaPassword" name="vecchiaPassword" required>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label fw-semibold">Nuova Password</label>
                    <input type="password" class="form-control rounded-3" id="loginPassword" name="nuovaPassword" required>

                    <div id="wrongPassword" class="text-danger small mt-1 d-none">
                        <i class="bi bi-x-circle-fill me-1"></i> La password deve essere di esattamente 8 caratteri e contenere "id_20".
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">Conferma Nuova Password</label>
                    <input type="password" class="form-control rounded-3" id="confirmPassword" required>

                    <div id="differentPasswords" class="text-danger small mt-1 d-none">
                        <i class="bi bi-x-circle-fill me-1"></i> Le due password non coincidono.
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger fw-bold rounded-pill shadow-sm">Aggiorna Password</button>
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary fw-bold rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i> Annulla e torna indietro
                    </a>
                </div>
            </form>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/auth/passwordChecker.js}"></script>
</body>
</html>
