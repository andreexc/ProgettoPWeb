<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Dettaglio Allenamento</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style>
        .exercise-row:not(:last-child) { border-bottom: 1px solid #eee; }
        .exercise-name { font-weight: 600; }
        .exercise-meta { font-size: .9rem; white-space: nowrap; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100" style="min-height: 100vh; overflow: hidden;">
    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.85); z-index: -1;"></div>

    <div class="container text-white" style="padding-top: 8rem; padding-bottom: 4rem; max-width: 700px;">
        <a th:href="@{/dashboard/allenamento}" class="text-white-50 text-decoration-none mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i>Torna agli allenamenti
        </a>

        <div class="card shadow border-0 rounded-4 bg-white text-dark p-4">
            <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom">
                <h3 class="fw-bold mb-0" th:text="${allenamento.nomeProgramma}">Nome Allenamento</h3>
                <span class="badge bg-danger rounded-pill px-3 py-2">
                    <i class="bi bi-fire me-1"></i><span th:text="${allenamento.kcalTotali}">0</span> kcal
                </span>
            </div>

            <div class="mb-4">
                <div class="exercise-row d-flex justify-content-between align-items-center py-2"
                     th:each="esercizio : ${allenamento.esercizi}">
                    <span class="exercise-name" th:text="${esercizio.esercizio}">Esercizio</span>
                    <span class="exercise-meta text-secondary">
                        <span th:text="${esercizio.nSerie}">3</span> serie x <span th:text="${esercizio.nRipetizioni}">12</span> rip.
                    </span>
                </div>
            </div>

            <form th:action="@{/dashboard/allenamento/avvia}" method="post">
                <input type="hidden" name="id" th:value="${allenamento.id}">
                <button type="submit" class="btn btn-danger fw-bold w-100 rounded-pill">
                    <i class="bi bi-play-btn-fill me-2"></i>Allenamento
                </button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: publicFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
