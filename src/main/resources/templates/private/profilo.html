<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Profilo Atleta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body class="bg-dark d-flex flex-column min-vh-100 text-white">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100 d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.85); z-index: -1;"></div>

    <div class="container" style="max-width: 600px; margin-top: 6rem;">
        <div class="card shadow border-0 rounded-4 bg-white text-dark p-4">
            <div class="text-center mb-4">
                <div class="display-4 text-danger"><i class="bi bi-person-badge"></i></div>
                <h2 class="fw-bold m-0 text-dark">Profilo Atleta</h2>
                <p class="text-muted mb-0">Riepilogo dei tuoi dati personali</p>
            </div>

            <div class="list-group list-group-flush mb-4">
                <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted fw-semibold"><i class="bi bi-person me-2"></i>Nome</span>
                    <span class="fw-bold text-dark" th:text="${nome}">Nome Atleta</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted fw-semibold"><i class="bi bi-person me-2"></i>Cognome</span>
                    <span class="fw-bold text-dark" th:text="${cognome}">Cognome Atleta</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted fw-semibold"><i class="bi bi-person-vcard me-2"></i>Username</span>
                    <span class="fw-bold text-dark text-danger" th:text="${usernameUtente}">username</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted fw-semibold"><i class="bi bi-calendar3 me-2"></i>Data di Nascita</span>
                    <span class="fw-bold text-dark" th:text="${dataNascita}">01/01/2000</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted fw-semibold"><i class="bi bi-shield-check me-2"></i>Livello Account</span>
                    <span class="badge bg-danger px-3 py-2 rounded-pill fw-bold" th:text="${ruolo}">PRO</span>
                </div>
            </div>

            <div class="d-grid">
                <a th:href="@{/dashboard}" class="btn btn-dark fw-bold rounded-pill">
                    <i class="bi bi-arrow-left me-2"></i>Torna alla Dashboard
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: publicFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
