    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org" lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Olympus Fitness - Dashboard Pro</title>

        <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="stylesheet" th:href="@{/css/navbar.css}">

        <!-- csrf meta tag necessary for reviews send -->
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </head>
    <body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: headerNav}"></div>

    <main class="flex-grow-1 position-relative w-100 d-flex align-items-center" style="min-height: 100vh; overflow: hidden;">
        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
             class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.85); z-index: -1;"></div>

        <div class="container text-white" style="padding-top: 8rem; padding-bottom: 4rem;">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
                <div>
                    <h1 class="fw-bold mb-0 text-warning"><i class="bi bi-gem me-2"></i>Area Elite Pro</h1>
                    <p class="text-white-50 mb-0">Benvenuto/a, <span class="text-white fw-bold" th:text="${usernameUtente}">Utente</span>!</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card shadow border-0 rounded-4 bg-white text-dark p-4 h-100">
                        <h5 class="fw-bold mb-3"><i class="bi bi-trophy-fill text-danger me-2"></i>Pannello PRO</h5>
                        <div class="d-grid gap-2">
                            <a th:href="@{/dashboard/profilo}" class="btn btn-outline-dark fw-bold text-start"><i class="bi bi-person-lines-fill me-2"></i> Profilo</a>
                            <a th:href="@{/dashboard/allenamento}" class="btn btn-danger text-white fw-bold text-start"><i class="bi bi-fire me-2"></i> Allenamento</a>
                            <a th:href="@{/dashboard/nuovo-allenamento}" class="btn btn-dark text-white fw-bold text-start"><i class="bi bi-fire me-2"></i>Crea un allenamento personalizzato</a>
                        </div>
                        <div class="mt-4 pt-3 border-top">
                            <h6 class="fw-bold text-danger mb-2"><i class="bi bi-chat-left-heart-fill me-2"></i>Lascia Recensione</h6>
                            <form id="ajaxReviewForm" onsubmit="event.preventDefault(); inviaRecensione(document.getElementById('testoRecensione').value); document.getElementById('testoRecensione').value='';">
                                <textarea class="form-control form-control-sm mb-2" id="testoRecensione" rows="2" placeholder="La tua opinione..." required></textarea>
                                <button type="submit" class="btn btn-danger btn-sm w-100 fw-bold rounded-pill">Invia</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="card shadow border-0 rounded-4 bg-white text-dark p-4 h-100">
                        <h5 class="fw-bold mb-3"><i class="bi bi-graph-up-arrow text-danger me-2"></i>Statistiche</h5>
                        <div style="height: 320px;"><canvas id="personalProChart"></canvas></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <section class="bg-light py-5">
        <div th:replace="~{public/reviews :: reviewComponent}"></div>
    </section>

    <div th:replace="~{fragments/footer :: publicFooter}"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/reviews/reviewHandler.js}" defer></script>

    <script th:inline="javascript" defer>
        document.addEventListener("DOMContentLoaded", function () {
            const ctx = document.getElementById('personalProChart').getContext('2d');
            const labels = /*[[${statsLabels}]]*/ [];
            const valori = /*[[${statsValori}]]*/ [];
            new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Sessioni', data: valori, backgroundColor: '#dc3545' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        });
    </script>
    </body>
    </html>
