<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Nuovo Allenamento</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style>
        .exercise-pick-row:not(:last-child) { border-bottom: 1px solid #eee; }
        .exercise-pick-row.selected { background-color: #fff5f5; }
        .qty-input { width: 70px; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100" style="min-height: 100vh; overflow: hidden;">
    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.85); z-index: -1;"></div>

    <div class="container text-white" style="padding-top: 8rem; padding-bottom: 4rem; max-width: 700px;">
        <h1 class="fw-bold text-warning mb-4"><i class="bi bi-plus-circle-fill me-2"></i>Crea Nuovo Allenamento</h1>

        <div class="card shadow border-0 rounded-4 bg-white text-dark p-4">
            <form th:action="@{/dashboard/nuovo-allenamento}" method="post">

                <div class="mb-4">
                    <label class="form-label fw-bold">Nome dell'allenamento</label>
                    <input type="text" name="nomeProgramma" class="form-control" required>
                </div>

                <label class="form-label fw-bold">Seleziona gli esercizi</label>
                <div class="mb-4">
                    <div class="exercise-pick-row d-flex align-items-center py-2 gap-3"
                         th:each="esercizio, status : ${catalogoEsercizi}">

                        <div class="form-check flex-grow-1">
                            <input class="form-check-input exercise-checkbox" type="checkbox"
                                   th:id="${'chk-' + esercizio.id}"
                                   onchange="toggleEsercizio(this)">
                            <label class="form-check-label" th:for="${'chk-' + esercizio.id}"
                                   th:text="${esercizio.esercizio}">Nome Esercizio</label>
                        </div>

                        <input type="hidden" name="idEsercizio" th:value="${esercizio.id}" disabled
                               class="idEsercizio-input">

                        <input type="number" name="nSerie" class="form-control form-control-sm qty-input"
                               placeholder="Serie" min="1" disabled>

                        <input type="number" name="nRipetizioni" class="form-control form-control-sm qty-input"
                               placeholder="Rip." min="1" disabled>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger fw-bold w-100 rounded-pill">
                    <i class="bi bi-check-circle-fill me-2"></i>Crea Allenamento
                </button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script defer>
    function toggleEsercizio(checkbox) {
        const row = checkbox.closest('.exercise-pick-row');
        const inputs = row.querySelectorAll('input[type="hidden"], input[type="number"]');

        row.classList.toggle('selected', checkbox.checked);

        inputs.forEach(input => {
            input.disabled = !checkbox.checked;
            if (checkbox.checked && input.type === 'number') {
                input.required = true;
            } else if (input.type === 'number') {
                input.required = false;
            }
        });
    }
</script>
</body>
</html>
