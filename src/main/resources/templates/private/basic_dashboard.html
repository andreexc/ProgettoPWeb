<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Fitness - Dashboard Basic</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: headerNav}"></div>

<main class="flex-grow-1 position-relative w-100 d-flex align-items-center" style="min-height: 100vh; overflow: hidden;">
    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
         class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; z-index: -2;" alt="Gym Background">
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.8); z-index: -1;"></div>

    <div class="container text-white" style="padding-top: 8rem; padding-bottom: 4rem;">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h1 class="fw-bold mb-0 text-warning">
                    <i class="bi bi-person-workspace me-2"></i>Pannello Atleta
                </h1>
                <p class="text-white-50 mb-0">
                    Benvenuto/a, <span class="text-white fw-bold" th:text="${usernameUtente}">Utente</span>! Piano attivo: <span class="badge bg-primary">Basic</span>
                </p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow border-0 rounded-4 bg-white text-dark p-4 h-100 d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="fw-bold mb-3"><i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>Servizi Inclusi</h5>
                        <div class="d-grid gap-2">
                            <a th:href="@{/dashboard/profilo}" class="btn btn-outline-dark fw-bold text-start"><i class="bi bi-person-badge me-2"></i> Profilo Atleta</a>
                            <a th:href="@{/dashboard/cambio-password}" class="btn btn-outline-dark fw-bold text-start"><i class="bi bi-shield-lock me-2"></i> Password</a>
                            <a th:href="@{/dashboard/allenamento}" class="btn btn-primary fw-bold text-start"><i class="bi bi-play-btn-fill me-2"></i> Inizia Allenamento</a>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top">
                        <h6 class="fw-bold text-danger mb-2"><i class="bi bi-chat-left-heart-fill me-2"></i>Lascia Recensione</h6>
                        <form id="ajaxReviewForm" method="post">
                            <textarea class="form-control form-control-sm mb-2" id="testoRecensione" rows="2" placeholder="La tua opinione..." required></textarea>
                            <button type="submit" class="btn btn-danger btn-sm w-100 fw-bold rounded-pill">Invia Recensione</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow border-0 rounded-4 bg-white text-dark p-4 h-100">
                    <h5 class="fw-bold mb-3"><i class="bi bi-bar-chart-line-fill text-success me-2"></i>Il tuo Riepilogo Allenamenti Svolti</h5>
                    <div style="position: relative; height: 280px; width: 100%;">
                        <canvas id="personalChart"></canvas>
                    </div>
                    <div class="text-center mt-3">
                        <a th:href="@{/dashboard/upgrade}" class="btn btn-outline-danger fw-bold rounded-pill px-4 btn-sm">
                            <i class="bi bi-gem me-2"></i>Passa al piano PRO per schede personalizzate
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/reviews :: carouselRecensioni}"></div>
<div th:replace="~{fragments/footer :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/recensioni-carousel.js}"></script>
<script th:src="@{/js/recensioni-ajax.js}"></script>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById('personalChart').getContext('2d');
        const labels = /*[[${statsLabels}]]*/ ['Full Body', 'Push/Pull/Legs', 'Cardio', 'Strength'];
        const valori = /*[[${statsValori}]]*/ [0, 0, 0, 0];

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Sessioni da te completate',
                    data: valori,
                    backgroundColor: 'rgba(25, 135, 84, 0.75)',
                    borderColor: '#198754',
                    borderWidth: 1.5,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });
    });
</script>
</body>
</html>
