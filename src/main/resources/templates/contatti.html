<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Olympus Fitness - Contattaci</title>

        <link rel="icon" type="image/svg+xml" th:href="@{/images/OlympusFitness_logo.svg}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/contatti.css}">
    </head>
    <body class="bg-light d-flex flex-column min-vh-100">
        <div th:replace="~{fragments/navbar :: headerNav}"></div>
        <main class="flex-grow-1 main-content">
            <div class="container my-5">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8">
                        <div class="card shadow border-0 rounded-4 p-4 p-sm-5 bg-white">
                            <div class="text-center mb-4">
                                <div class="icon-shape bg-dark text-white rounded-circle mb-3 mx-auto d-flex align-items-center justify-content-center">
                                    <i class="bi bi-envelope-paper-fill fs-4"></i>
                                </div>
                                <h2 class="fw-bold text-dark">Mettiti in contatto</h2>
                                <p class="text-muted small">Hai domande sui nostri piani d'allenamento? Scrivici un messaggio.</p>
                            </div>
                            <form th:action="@{/contatti/invia}" method="POST" class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label for="nome" class="form-label fw-semibold small text-secondary">Nome Completo</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                        <input type="text" class="form-control bg-light border-start-0" id="nome" name="nome" placeholder="Mario Rossi" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold small text-secondary">Indirizzo Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                        <input type="email" class="form-control bg-light border-start-0" id="email" name="email" placeholder="mario.rossi@example.com" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="messaggio" class="form-label fw-semibold small text-secondary">Il tuo Messaggio</label>
                                    <textarea class="form-control bg-light" id="messaggio" name="messaggio" rows="4" placeholder="Scrivi qui la tua richiesta..." required></textarea>
                                </div>

                                <button type="submit" class="btn btn-dark w-100 py-3 fw-bold rounded-pill shadow-sm hover-lift">
                                    <i class="bi bi-send-fill me-2"></i>Invia Messaggio
                                </button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
            <!-- <div th:replace="~{fragments/reviews :: carouselRecensioni}"></div> -->
        </main>
        <div th:replace="~{fragments/footer :: publicFooter}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            (() => {
                'use strict'
                const forms = document.querySelectorAll('.needs-validation')
                Array.from(forms).forEach(form => {
                    form.addEventListener('submit', event => {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
            })()
        </script>
    </body>
</html>
